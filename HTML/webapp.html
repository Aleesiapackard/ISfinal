<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Riddle Generator</title>
  <style>
    .common {
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    .header {
      background-color: black;
      color: white;
      height: 100px;
      line-height: 100px;
      font-size: 32px;
    }

    .mainbody {
      background-color: whitesmoke;
      padding: 50px;
    }

    .Footer {
      position: fixed;
      background-color: black;
      color: white;
      bottom: 0px;
      left: 5px;
      right: 5px;
      height: 25px;
      line-height: 25px;
      text-align: center;
      font-size: 14px;
    }

    img {
      display: block;
      width: 25%;
      margin-left: auto;
      margin-right: auto;
    }

    nav {
      background-color: lightgray;
      padding: 10px;
      overflow: hidden;
      text-align: center;
    }

    nav a {
      color: #333;
      text-decoration: none;
      padding: 20px;
      font-weight: bold;
    }

    nav a:hover {
      background-color: #ccc;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: auto;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background-color: #000000;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #494949;
    }

    #answer {
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body class="common mainbody">

  <div class="header">Riddle Generator</div>

  <nav>
    <a href="../index.html">Home Page</a>
    <a href="Hobbypage.html">Hobby Page</a>
    <a href="webapp.html">Web App Page</a>
  </nav>
  <br>
  <br>
  <br>
  <br>
  <br>
  <br>

  <div class="card">
    <p id="riddle">Click below to get a riddle!</p>
    <button onclick="generateRiddle()">Get Riddle</button>
    <button onclick="showAnswer()">Show Answer</button>
    <p id="answer" style="display:none;"></p>
  </div>

  <div class="Footer">© 2025 AleesiaPackard. All rights reserved.</div>

  <script>
    const riddles = [
      {
        question: "What has to be broken before you can use it?",
        answer: "An egg."
      },
      {
        question: "I’m tall when I’m young, and I’m short when I’m old. What am I?",
        answer: "A candle."
      },
      {
        question: "What can’t talk but will reply when spoken to?",
        answer: "An echo."
      }
    ];

    let currentRiddle = null;

    function generateRiddle() {
      const randomIndex = Math.floor(Math.random() * riddles.length);
      currentRiddle = riddles[randomIndex];
      document.getElementById("riddle").textContent = currentRiddle.question;
      document.getElementById("answer").style.display = "none";
    }

    function showAnswer() {
      if (currentRiddle) {
        document.getElementById("answer").textContent = currentRiddle.answer;
        document.getElementById("answer").style.display = "block";
      }
    }
  </script>

</body>
</html>
